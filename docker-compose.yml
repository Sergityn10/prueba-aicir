services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taller-bicis-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/app/data/taller.db
    volumes:
      - taller_db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend-bicis
      dockerfile: Dockerfile
    container_name: taller-bicis-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taller_db_data:
    driver: local
